#!/bin/bash

load_tenant_config() {
	local tenant="$1"

	case "$tenant" in
		mcal)
			SERVER_USER="frappe"
			SERVER_HOST="mcalfrappe.coreaxissolutions.in"
			BENCH_DIR="/home/frappe/frappe-bench"
			SITE="mcalfrappe.coreaxissolutions.in"
			IDENTITY_FILE="personal"
			;;
		conceptiqs)
			SERVER_USER="frappeuser"
			SERVER_HOST="lmsbackend.conceptiqs.com"
			BENCH_DIR="/home/frappeuser/frappe-bench"
			SITE="lmsbackend.conceptiqs.com"
			IDENTITY_FILE="personal"
			;;
		*)
			return 1
			;;
	esac
}

available_tenants() {
	echo "mcal"
	echo "conceptiqs"
}
